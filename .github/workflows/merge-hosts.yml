name: merge-hosts
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}      # manual run button

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge sources
        run: python merge_hosts.py
      - name: Commit and push if changed
        run: |
          git config user.name "hosts-bot"
          git config user.email "actions@github.com"
          if [ -z "$(git status --porcelain hosts)" ]; then
            echo "No changes"
          else
            git add hosts
            git commit -m "auto: update merged hosts $(date -u +%Y-%m-%d)"
            git push
          fi
